name: Keep backend warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sS -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" \
            "https://techblogai-backend.onrender.com/api/health" \
            || curl -sS -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" \
            "https://techblogai-backend.onrender.com/"